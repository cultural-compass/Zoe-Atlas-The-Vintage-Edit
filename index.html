<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>💖 The Vintage Edit: Global Thrift & Vintage Map 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 15px;
      color: white;
      background: linear-gradient(90deg, teal, pink, lavender, green);
    }

    header h1 {
      margin: 0;
      font-size: 1.8em;
    }

    header p {
      margin: 5px 0 0 0;
      font-size: 1em;
    }

    #description {
      padding: 10px;
      text-align: center;
      font-size: 1em;
      background-color: #fefefe;
    }

    #map {
      height: calc(100vh - 240px);
      width: 100%;
    }

    footer {
      padding: 10px;
      text-align: center;
      background: linear-gradient(90deg, teal, pink, lavender, green);
    }

    #search {
      padding: 5px;
      font-size: 1em;
      border: none;
      border-radius: 5px;
      width: 60%;
      margin-bottom: 5px;
    }

    #shop-list {
      max-height: 120px;
      overflow-y: auto;
      margin: 0 auto;
      width: 60%;
      text-align: left;
      background-color: #fff;
      border-radius: 5px;
      padding: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    #shop-list div {
      padding: 5px;
      cursor: pointer;
    }

    #shop-list div:hover {
      background-color: #f0f0f0;
    }

    a {
      color: teal;
    }
  </style>
</head>
<body>

<header>
  <h1>💖 The Vintage Edit: Global Thrift & Vintage Map💖</h1>
  <p>Click a marker to zoom in and open its location in Google Maps. Use the search bar or list below to explore!</p>
</header>

<div id="description">
  Discover curated global thrift and vintage finds… starting with Dublin! 💖 👜👗💎
</div>

<div id="map"></div>

<footer>
  <input type="text" id="search" placeholder="Search shops by name...">
  <div id="shop-list"></div>
</footer>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([53.3442, -6.2631], 14);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  function googleMapsLink(lat, lng) {
    return `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
  }

  const shops = [
    {name: "Nine Crows Vintage 👜👗", coords: [53.3442, -6.2631], description: "Curated Y2K & 90s clothing & accessories.", link: googleMapsLink(53.3442, -6.2631)},
    {name: "Lou's Lot 💎👗", coords: [53.3445, -6.2645], description: "Designer bags, clothing & vintage homeware.", link: googleMapsLink(53.3445, -6.2645)},
    {name: "Lucy's Lounge 🐇👗", coords: [53.3438, -6.2638], description: "Vintage inspired by Alice in Wonderland.", link: googleMapsLink(53.3438, -6.2638)},
    {name: "Enable Ireland Charity Shop 🎀", coords: [53.3446, -6.2640], description: "Accessories & Y2K finds, great cause.", link: googleMapsLink(53.3446, -6.2640)},
    {name: "Vincent's 👜", coords: [53.3441, -6.2639], description: "Big store, can get overwhelming but good finds.", link: googleMapsLink(53.3441, -6.2639)},
    {name: "Oxfam Home 👗", coords: [53.3370, -6.2710], description: "Vintage & great prices.", link: googleMapsLink(53.3370, -6.2710)},
    {name: "Simon Dublin 🎒", coords: [53.3349, -6.2675], description: "Great bags & friendly staff.", link: googleMapsLink(53.3349, -6.2675)},
    {name: "NCBI Charity Store 💎", coords: [53.3335, -6.2680], description: "Affordable finds.", link: googleMapsLink(53.3335, -6.2680)},
    {name: "Assisi Dublin 👜", coords: [53.3385, -6.2770], description: "Back of Liberty Market, Italy-sourced luxury.", link: googleMapsLink(53.3385, -6.2770)},
    {name: "Dalymount Park Flea Market 🏷️", coords: [53.3565, -6.2672], description: "Phibsborough, Dublin 7.", link: googleMapsLink(53.3565, -6.2672)},
    {name: "Lezeitgeist Flea Market 🍴👗", coords: [53.3565, -6.2672], description: "Food & clothing. Check their FB for schedule.", link: "https://www.facebook.com/lezeitgeistfleamarket/"}
  ];

  const markers = [];
  const shopListDiv = document.getElementById('shop-list');

  shops.forEach(shop => {
    const marker = L.marker(shop.coords).addTo(map)
      .bindPopup(`<b>${shop.name}</b><br>${shop.description}<br>${shop.coords}<br><a href="${shop.link}" target="_blank">Open in Google Maps</a>`);

    marker.on('click', () => map.setView(shop.coords, 16));

    markers.push({marker, name: shop.name.toLowerCase()});

    // Add to clickable list
    const shopItem = document.createElement('div');
    shopItem.textContent = shop.name;
    shopItem.addEventListener('click', () => {
      map.setView(shop.coords, 16);
      marker.openPopup();
    });
    shopListDiv.appendChild(shopItem);
  });

  // Search/filter functionality
  const searchInput = document.getElementById('search');
  searchInput.addEventListener('input', () => {
    const query = searchInput.value.toLowerCase();
    markers.forEach(obj => {
      if (obj.name.includes(query)) {
        obj.marker.addTo(map);
      } else {
        map.removeLayer(obj.marker);
      }
    });

    shopListDiv.childNodes.forEach((item, idx) => {
      if (shops[idx].name.toLowerCase().includes(query)) {
        item.style.display = '';
      } else {
        item.style.display = 'none';
      }
    });
  });
</script>

</body>
</html>
