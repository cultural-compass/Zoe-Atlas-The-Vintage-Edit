<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Vintage Edit - Dublin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    #map {
      height: 100vh;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // Initialize map centered on Dublin
    const map = L.map('map').setView([53.3498, -6.2603], 13);

    // Tile layer (this makes the actual map show)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    // Helper to build Google Maps links
    function mapsLink(name, address) {
      return `<b>${name}</b><br>${address}<br>
      <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}" target="_blank">Open in Google Maps</a>`;
    }

    // Vintage & charity shops
    const shops = [
      {
        name: "Nine Crows Vintage (Temple Bar)",
        address: "22 Temple Lane South, Temple Bar, Dublin 2",
        coords: [53.3447, -6.2635]
      },
      {
        name: "Lou's Lot",
        address: "George's Street Arcade, South Great George's Street, Dublin 2",
        coords: [53.3423, -6.2644]
      },
      {
        name: "Lucy's Lounge",
        address: "11 Fownes Street Upper, Dublin D02 XW64",
        coords: [53.3453, -6.2632]
      },
      {
        name: "Enable Ireland Charity Shop",
        address: "8 South Great George's Street, Dublin",
        coords: [53.3422, -6.2640]
      },
      {
        name: "Vincent's George's Street",
        address: "Unit 11, 73, 83 South Great George's Street, Dublin",
        coords: [53.3425, -6.2639]
      },
      {
        name: "Oxfam Home",
        address: "Francis Street, Dublin",
        coords: [53.3416, -6.2731]
      },
      {
        name: "Simon Community Shop",
        address: "57 Lower Camden Street, Dublin",
        coords: [53.3345, -6.2652]
      },
      {
        name: "NCBI Charity Store",
        address: "Camden Street Lower, Saint Kevin's, Dublin 2",
        coords: [53.3338, -6.2650]
      },
      {
        name: "Assisi Dublin",
        address: "71 Meath Street, Dublin D8",
        coords: [53.3421, -6.2745]
      },
      {
        name: "Le Zeitgeist Flea Market",
        address: "Dalymount Park, Phibsborough, Dublin 7, Ireland",
        coords: [53.3607, -6.2722]
      }
    ];

    // Add markers
    shops.forEach(shop => {
      L.marker(shop.coords).addTo(map)
        .bindPopup(mapsLink(shop.name, shop.address));
    });
  </script>
</body>
</html>
