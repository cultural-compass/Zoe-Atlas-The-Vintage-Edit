<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>💖 The Vintage Edit: Global Thrift & Vintage Map 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 15px;
      color: white;
      background: linear-gradient(90deg, teal, pink, lavender, green);
    }

    header h1 {
      margin: 0;
      font-size: 1.8em;
    }

    header p {
      margin: 5px 0 0 0;
      font-size: 1em;
    }

    #description {
      padding: 10px;
      text-align: center;
      font-size: 1em;
      background-color: #fefefe;
    }

    #map {
      height: calc(100vh - 240px); /* header + description + footer + list */
      width: 100%;
    }

    footer {
      padding: 10px;
      text-align: center;
      background: linear-gradient(90deg, teal, pink, lavender, green);
    }

    #search {
      padding: 5px;
      font-size: 1em;
      border: none;
      border-radius: 5px;
      width: 60%;
      margin-bottom: 5px;
    }

    #shop-list {
      max-height: 120px;
      overflow-y: auto;
      margin: 0 auto;
      width: 60%;
      text-align: left;
      background-color: #fff;
      border-radius: 5px;
      padding: 5px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    #shop-list div {
      padding: 5px;
      cursor: pointer;
    }

    #shop-list div:hover {
      background-color: #f0f0f0;
    }

    a {
      color: teal;
    }
  </style>
</head>
<body>

<header>
  <h1>💖 The Vintage Edit: Global Thrift & Vintage Map 💖</h1>
  <p>Explore curated vintage and thrift shops from around the world!</p>
</header>

<div id="description">
  Click a marker to zoom in and open its location in Google Maps.<br>
  Use the search bar or click a shop from the list below to find your favorite spots.
</div>

<div id="map"></div>

<footer>
  <input type="text" id="search" placeholder="Search shops by name...">
  <div id="shop-list"></div>
</footer>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  // Start centered on Dublin
  const map = L.map('map').setView([53.3447, -6.2635], 6);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  const colors = ['teal', 'pink', 'lavender', 'green'];

  function mapsLink(name, address) {
    return `<b>${name}</b><br>${address}<br>
    <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}" target="_blank">Open in Google Maps</a>`;
  }

  const shops = [
    {name: "Nine Crows Vintage", address: "22 Temple Lane South, Temple Bar, Dublin 2", coords: [53.3447, -6.2635]},
    {name: "Lou's Lot", address: "George's Street Arcade, South Great George's Street, Dublin 2", coords: [53.3423, -6.2644]},
    {name: "Lucy's Lounge", address: "11 Fownes Street Upper, Dublin D02 XW64", coords: [53.3453, -6.2632]},
    // Add more global shops here...
  ];

  const markers = [];
  const shopListDiv = document.getElementById('shop-list');

  shops.forEach((shop, index) => {
    const color = colors[index % colors.length];
    const marker = L.circleMarker(shop.coords, {
      radius: 10,
      fillColor: color,
      color: 'white',
      weight: 2,
      opacity: 1,
      fillOpacity: 0.9
    }).addTo(map).bindPopup(mapsLink(shop.name, shop.address));

    marker.on('click', () => {
      map.setView(marker.getLatLng(), 16);
    });

    markers.push({marker, name: shop.name.toLowerCase()});

    // Add to clickable list
    const shopItem = document.createElement('div');
    shopItem.textContent = shop.name;
    shopItem.addEventListener('click', () => {
      map.setView(shop.coords, 16);
      marker.openPopup();
    });
    shopListDiv.appendChild(shopItem);
  });

  // Search/filter functionality
  const searchInput = document.getElementById('search');
  searchInput.addEventListener('input', () => {
    const query = searchInput.value.toLowerCase();
    markers.forEach(obj => {
      if (obj.name.includes(query)) {
        obj.marker.addTo(map);
      } else {
        map.removeLayer(obj.marker);
      }
    });

    // Filter list too
    shopListDiv.childNodes.forEach((item, idx) => {
      if (shops[idx].name.toLowerCase().includes(query)) {
        item.style.display = '';
      } else {
        item.style.display = 'none';
      }
    });
  });
</script>

</body>
</html>
